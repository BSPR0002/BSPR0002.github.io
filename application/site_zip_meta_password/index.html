<!DOCTYPE HTML>
<html lang="zh-cmn-Hans">

<head>
	<meta charset=UTF-8>
	<title>本站压缩文件密码查看工具</title>
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<link rel="icon" type="image/png" href="icon.svg">
	<link rel="stylesheet" type="text/css" href="/css/BSIF_style.css">
	<link rel="stylesheet" type="text/css" href="main.css">
	<script src="main.mjs" type="module"></script>
	<link rel="stylesheet" type="text/css" href="page/common_style.css">
	<link rel="stylesheet" type="text/css" href="page/read_data/style.css">
	<link rel="stylesheet" type="text/css" href="page/append_data/style.css">
</head>

<body>
	<div id="main" class="bs-loading">
		<div id="tab-list">
			<button class="tab current">查看密码</button>
			<button class="tab">附加数据</button>
		</div>
		<div id="page-box">
			<div class="page current" id="page-read">
				<div class="file-component">
					<button class="normal select-file">选择文件</button>
					<div class="none-file">未选择文件</div>
					<div class="file-info">
						<h2 class="sub-title">文件信息</h2>
						<div class="file-info-content">
							<div class="file-info-sub-title">文件名</div>
							<div class="file-name"></div>
							<div class="file-info-sub-title">文件大小</div>
							<div class="file-size"></div>
							<button class="file-clear normal">清除</button>
						</div>
					</div>
				</div>
				<div class="line-v"></div>
				<div id="data-box">
					<div id="data-none-file">选择文件以读取信息</div>
					<div id="data-error">test</div>
					<div id="data-view">
						<h2 class="sub-title">数据内容</h2>
						<div id="data-content"></div>
						<button class="normal" id="data-copy">复制</button>
					</div>
				</div>
			</div>
			<div class="page" id="page-append">
				<div class="file-component">
					<button class="normal select-file">选择文件</button>
					<div class="none-file">未选择文件</div>
					<div class="file-info">
						<h2 class="sub-title">文件信息</h2>
						<div class="file-info-content">
							<div class="file-info-sub-title">文件名</div>
							<div class="file-name"></div>
							<div class="file-info-sub-title">文件大小</div>
							<div class="file-size"></div>
							<button class="file-clear normal">清除</button>
						</div>
					</div>
				</div>
				<div class="line-v"></div>
				<div id="append-view">
					<div>
						<h2 class="sub-title">输入信息内容</h2>
						<textarea id="append-input"></textarea>
					</div>
					<div id="append-write-view">
						<button id="append-write" class="normal" disabled>写入</button>
						<div id="append-write-tips">
							<span id="append-none-file">未选择文件</span>
							<span id="append-write-not-allow">test</span>
						</div>
					</div>
					<div id="append-warn">
						写入过程中请勿关闭浏览器，否则可能造成数据丢失<br>
						任何由使用本程序造成的数据损坏，本程序开发者概不负责<br>
						操作重要文件前请先备份
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
